<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { src: null, alt: '', caption: '' };

  componentDidMount() {
    this._key = (e) => { if (e.key === 'Escape') this.setState({ src: null }); };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); }

  renderVals() {
    return {
      lightboxOpen: !!this.state.src,
      lightboxSrc: this.state.src || '',
      lightboxAlt: this.state.alt,
      lightboxCaption: this.state.caption,
      closeLightbox: () => this.setState({ src: null }),
      onPhotoClick: (e) => {
        const fig = e.target.closest('[data-full]');
        if (!fig) return;
        const img = fig.querySelector('img');
        const cap = fig.querySelector('figcaption');
        this.setState({
          src: fig.getAttribute('data-full'),
          alt: img ? img.alt : '',
          caption: cap ? cap.textContent : ''
        });
      }
    };
  }
}
</script>
